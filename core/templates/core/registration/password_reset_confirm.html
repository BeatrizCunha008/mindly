{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINDLY - Nova Palavra-passe</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #6C63FF, #3F3D56);
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; color:#fff;
        }
        .container {
            background:rgba(0,0,0,0.7);
            padding:40px;
            border-radius:15px;
            width:90%; max-width:420px;
            text-align:center;
            box-shadow:0 8px 20px rgba(0,0,0,0.3);
        }
        h1 { color:#FFD700; margin-bottom:8px; font-size:28px; }
        p { color:#ccc; font-size:14px; margin-bottom:25px; }

        form { display:flex; flex-direction:column; text-align:left; }
        form p label { font-size:13px; color:#ccc; margin-bottom:4px; display:block; }
        form p input {
            width:100%; padding:12px; margin-bottom:15px;
            border-radius:10px; border:none; font-size:16px;
        }
        .errorlist { color:#ff6b6b; font-size:12px; list-style:none; margin-bottom:8px; }

        button {
            padding:12px; border:none; border-radius:50px;
            background:#FFD700; color:#3F3D56;
            font-weight:bold; font-size:16px; cursor:pointer; transition:0.3s;
        }
        button:hover { background:#FFC107; transform:translateY(-2px); }

        .link-invalido { color:#ff6b6b; font-size:15px; line-height:1.6; }
        .voltar { margin-top:15px; display:block; color:#ccc; text-decoration:underline; font-size:14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MINDLY</h1>
        {% if validlink %}
            <p>Introduz a tua nova palavra-passe.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Guardar nova palavra-passe</button>
            </form>
        {% else %}
            <p class="link-invalido">⚠️ Este link é inválido ou já expirou. Pede um novo link de recuperação.</p>
            <a class="voltar" href="{% url 'password_reset' %}">Pedir novo link</a>
        {% endif %}
    </div>
</body>
</html>
