{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINDLY - Criar Conta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6C63FF, #3F3D56);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .login-container {
            background: rgba(0,0,0,0.7);
            padding: 40px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .login-container h1 {
            margin-bottom: 10px;
            color: #FFD700;
        }

        .login-container p {
            margin-bottom: 25px;
            font-size: 14px;
            color: #ccc;
        }

        form {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        /* estilo para os campos gerados pelo Django */
        form p label {
            font-size: 13px;
            color: #ccc;
            margin-bottom: 4px;
            display: block;
        }

        form p input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
        }

        /* texto de ajuda do Django (requisitos da password) */
        form p ul {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 10px;
            padding-left: 15px;
        }

        /* erros */
        .errorlist {
            color: #ff6b6b;
            font-size: 12px;
            list-style: none;
            margin-bottom: 8px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 50px;
            background-color: #FFD700;
            color: #3F3D56;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        button:hover {
            background-color: #FFC107;
            transform: translateY(-3px);
        }

        .login-link {
            margin-top: 15px;
            display: block;
            color: #fff;
            text-decoration: underline;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>MINDLY</h1>
        <p>Cria a tua conta</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Criar conta</button>
        </form>
        <a class="login-link" href="{% url 'login' %}">Já tens conta? Entra aqui</a>
    </div>
</body>
</html>
