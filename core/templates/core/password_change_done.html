{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINDLY - Palavra-passe alterada</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #6C63FF, #3F3D56);
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; color:#fff;
        }
        .container {
            background:rgba(0,0,0,0.7);
            padding:40px;
            border-radius:15px;
            width:90%; max-width:420px;
            text-align:center;
            box-shadow:0 8px 20px rgba(0,0,0,0.3);
        }
        .emoji { font-size:60px; margin-bottom:15px; display:block; }
        h1 { color:#FFD700; margin-bottom:10px; font-size:26px; }
        p { color:#ccc; font-size:15px; margin-bottom:25px; line-height:1.6; }
        a {
            display:inline-block; padding:12px 30px;
            background:#FFD700; color:#3F3D56;
            border-radius:50px; font-weight:bold;
            text-decoration:none; font-size:16px; transition:0.3s;
        }
        a:hover { background:#FFC107; transform:translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <span class="emoji">✅</span>
        <h1>Palavra-passe alterada!</h1>
        <p>A tua palavra-passe foi alterada com sucesso. Podes continuar a usar o MINDLY normalmente.</p>
        <a href="{% url 'perfil' %}">← Voltar ao perfil</a>
    </div>
</body>
</html>
