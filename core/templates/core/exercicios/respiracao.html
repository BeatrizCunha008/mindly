{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINDLY - Guia Respiratório</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
        body { background-color:#B79F97; min-height:100vh; display:flex; flex-direction:column; }

        header {
            background-color:#F7EFEC;
            padding:20px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .logo { display:flex; align-items:center; gap:10px; }
        .logo img { width:45px; }
        .logo h1 { font-size:26px; color:#A2827A; font-weight:bold; }
        header nav a { margin-left:40px; text-decoration:none; font-size:18px; color:#A2827A; font-weight:bold; }
        .logout-btn { background-color:#A2827A; color:white; padding:8px 16px; border-radius:20px; text-decoration:none; font-weight:bold; }

        main { flex:1; display:flex; flex-direction:column; align-items:center; padding:40px 20px; }
        h2 { color:white; font-size:26px; margin-bottom:10px; }
        .subtitulo { color:#f0e6e2; font-size:15px; margin-bottom:30px; }

        /* ── ESCOLHA DO MODO ── */
        .modos {
            display:flex;
            gap:15px;
            margin-bottom:35px;
            flex-wrap:wrap;
            justify-content:center;
        }
        .modo-btn {
            padding:10px 25px;
            border:2px solid #F7EFEC;
            border-radius:50px;
            background:transparent;
            color:white;
            font-size:15px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }
        .modo-btn.ativo, .modo-btn:hover {
            background:#F7EFEC;
            color:#A2827A;
        }

        /* ── CÍRCULO ── */
        .circulo-container {
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:20px;
            margin-bottom:35px;
        }

        .circulo-exterior {
            width:220px; height:220px;
            border-radius:50%;
            background:rgba(247,239,236,0.2);
            display:flex;
            align-items:center;
            justify-content:center;
            position:relative;
        }

        .circulo {
            width:140px; height:140px;
            border-radius:50%;
            background:radial-gradient(circle, #F7EFEC, #C7B0A9);
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow:0 0 30px rgba(247,239,236,0.4);
            transition: transform 0.1s linear;
        }

        .texto-circulo {
            font-size:18px;
            font-weight:bold;
            color:#A2827A;
            text-align:center;
            line-height:1.3;
        }

        .contador {
            font-size:48px;
            font-weight:bold;
            color:white;
            min-width:60px;
            text-align:center;
        }

        .fase-texto {
            font-size:22px;
            font-weight:bold;
            color:white;
            text-align:center;
            min-height:30px;
        }

        /* ── BOTÕES ── */
        .botoes { display:flex; gap:15px; flex-wrap:wrap; justify-content:center; }
        .btn {
            padding:12px 35px;
            border:none;
            border-radius:50px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }
        .btn-iniciar { background:#F7EFEC; color:#A2827A; }
        .btn-iniciar:hover { background:#ede0db; transform:translateY(-2px); }
        .btn-parar { background:transparent; border:2px solid #F7EFEC; color:white; }
        .btn-parar:hover { background:rgba(255,255,255,0.1); }
        .btn-voltar {
            margin-top:20px;
            padding:10px 25px;
            background:transparent;
            border:2px solid #F7EFEC;
            border-radius:50px;
            color:white;
            font-size:14px;
            cursor:pointer;
            text-decoration:none;
            display:inline-block;
            transition:0.3s;
        }
        .btn-voltar:hover { background:rgba(255,255,255,0.1); }

        /* descrição do modo */
        .descricao-modo {
            background:rgba(247,239,236,0.15);
            border-radius:15px;
            padding:15px 25px;
            color:white;
            font-size:14px;
            text-align:center;
            max-width:400px;
            margin-bottom:25px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <img src="{% static 'core/imagens/logo.PNG' %}" alt="logo">
        <h1>MINDLY</h1>
    </div>
    <nav>
        <a href="{% url 'exercicios' %}">← Exercícios</a>
        <a href="{% url 'home' %}">Início</a>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
    {% csrf_token %}
    <button type="submit" class="logout-btn">Sair</button>
</form>
    </nav>
</header>

<main>
    <h2>🫁 Guia Respiratório</h2>
    <p class="subtitulo">Escolhe o tipo de respiração e segue o ritmo</p>

    <!-- ESCOLHA DO MODO -->
    <div class="modos">
        <button class="modo-btn ativo" onclick="escolherModo('simples', this)">Respiração Simples</button>
        <button class="modo-btn" onclick="escolherModo('478', this)">Técnica 4-7-8</button>
        <button class="modo-btn" onclick="escolherModo('caixa', this)">Respiração em Caixa</button>
    </div>

    <!-- DESCRIÇÃO -->
    <div class="descricao-modo" id="descricaoModo">
        Inspira 4 segundos → Expira 4 segundos. Ideal para acalmar rapidamente.
    </div>

    <!-- CÍRCULO ANIMADO -->
    <div class="circulo-container">
        <div class="circulo-exterior">
            <div class="circulo" id="circulo">
                <div class="texto-circulo" id="textoCirculo">Pronto?</div>
            </div>
        </div>
        <div class="contador" id="contador">-</div>
        <div class="fase-texto" id="faseTexto">Carrega em Iniciar</div>
    </div>

    <!-- BOTÕES -->
    <div class="botoes">
        <button class="btn btn-iniciar" id="btnIniciar" onclick="iniciar()">▶ Iniciar</button>
        <button class="btn btn-parar" id="btnParar" onclick="parar()" style="display:none">⏹ Parar</button>
    </div>

    <a href="{% url 'exercicios' %}" class="btn-voltar">← Voltar aos Exercícios</a>
</main>

<script>
    // modos: [nome_fase, segundos, ...]
    const modos = {
        simples: {
            descricao: 'Inspira 4 segundos → Expira 4 segundos. Ideal para acalmar rapidamente.',
            fases: [
                { nome: 'Inspira...', segundos: 4, escala: 1.6 },
                { nome: 'Expira...', segundos: 4, escala: 1.0 },
            ]
        },
        '478': {
            descricao: 'Inspira 4s → Segura 7s → Expira 8s. Excelente para reduzir ansiedade.',
            fases: [
                { nome: 'Inspira...', segundos: 4, escala: 1.6 },
                { nome: 'Segura...', segundos: 7, escala: 1.6 },
                { nome: 'Expira...', segundos: 8, escala: 1.0 },
            ]
        },
        caixa: {
            descricao: 'Inspira 4s → Segura 4s → Expira 4s → Segura 4s. Técnica usada por militares.',
            fases: [
                { nome: 'Inspira...', segundos: 4, escala: 1.6 },
                { nome: 'Segura...', segundos: 4, escala: 1.6 },
                { nome: 'Expira...', segundos: 4, escala: 1.0 },
                { nome: 'Segura...', segundos: 4, escala: 1.0 },
            ]
        }
    };

    let modoAtual = 'simples';
    let intervalo = null;
    let faseAtual = 0;
    let segundosRestantes = 0;
    let ativo = false;

    function escolherModo(modo, btn) {
        modoAtual = modo;
        document.querySelectorAll('.modo-btn').forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativo');
        document.getElementById('descricaoModo').textContent = modos[modo].descricao;
        if (ativo) parar();
        resetar();
    }

    function resetar() {
        document.getElementById('textoCirculo').textContent = 'Pronto?';
        document.getElementById('contador').textContent = '-';
        document.getElementById('faseTexto').textContent = 'Carrega em Iniciar';
        document.getElementById('circulo').style.transform = 'scale(1)';
    }

    function iniciar() {
        ativo = true;
        faseAtual = 0;
        document.getElementById('btnIniciar').style.display = 'none';
        document.getElementById('btnParar').style.display = 'inline-block';
        correrFase();
    }

    function correrFase() {
        if (!ativo) return;
        const fases = modos[modoAtual].fases;
        const fase = fases[faseAtual % fases.length];
        segundosRestantes = fase.segundos;

        document.getElementById('faseTexto').textContent = fase.nome;
        document.getElementById('textoCirculo').textContent = fase.nome.replace('...', '');

        // animação do círculo
        const circulo = document.getElementById('circulo');
        const duracao = fase.segundos * 1000;
        circulo.style.transition = `transform ${duracao}ms ease-in-out`;
        circulo.style.transform = `scale(${fase.escala})`;

        document.getElementById('contador').textContent = segundosRestantes;

        intervalo = setInterval(() => {
            segundosRestantes--;
            document.getElementById('contador').textContent = segundosRestantes;
            if (segundosRestantes <= 0) {
                clearInterval(intervalo);
                faseAtual++;
                setTimeout(correrFase, 300);
            }
        }, 1000);
    }

    function parar() {
        ativo = false;
        clearInterval(intervalo);
        document.getElementById('btnIniciar').style.display = 'inline-block';
        document.getElementById('btnParar').style.display = 'none';
        resetar();
    }
</script>

</body>
</html>
