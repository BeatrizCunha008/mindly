{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINDLY - Mindfulness</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
        body { background-color:#B79F97; min-height:100vh; display:flex; flex-direction:column; }

        header {
            background-color:#F7EFEC;
            padding:20px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .logo { display:flex; align-items:center; gap:10px; }
        .logo img { width:45px; }
        .logo h1 { font-size:26px; color:#A2827A; font-weight:bold; }
        header nav a { margin-left:40px; text-decoration:none; font-size:18px; color:#A2827A; font-weight:bold; }
        .logout-btn { background-color:#A2827A; color:white; padding:8px 16px; border-radius:20px; text-decoration:none; font-weight:bold; }

        main {
            flex:1;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:40px 20px;
            position:relative;
            overflow:hidden;
        }

        /* ── ONDAS DE FUNDO ── */
        .onda {
            position:absolute;
            border-radius:50%;
            background:rgba(247,239,236,0.08);
            animation: expandir 4s ease-in-out infinite;
        }
        .onda:nth-child(1) { width:200px; height:200px; animation-delay:0s; }
        .onda:nth-child(2) { width:350px; height:350px; animation-delay:1s; }
        .onda:nth-child(3) { width:500px; height:500px; animation-delay:2s; }
        .onda:nth-child(4) { width:650px; height:650px; animation-delay:3s; }

        @keyframes expandir {
            0%   { transform:scale(0.8); opacity:0.6; }
            50%  { transform:scale(1.1); opacity:0.2; }
            100% { transform:scale(0.8); opacity:0.6; }
        }

        .conteudo {
            position:relative;
            z-index:10;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:25px;
            text-align:center;
        }

        h2 { color:white; font-size:28px; }
        .subtitulo { color:#f0e6e2; font-size:15px; max-width:400px; line-height:1.6; }

        .frase-container {
            background:rgba(247,239,236,0.15);
            border-radius:20px;
            padding:25px 35px;
            max-width:500px;
            backdrop-filter:blur(5px);
        }
        .frase {
            font-size:20px;
            color:white;
            font-style:italic;
            line-height:1.6;
            transition: opacity 1s ease;
        }

        .temporizador {
            font-size:56px;
            font-weight:bold;
            color:white;
            text-shadow:0 2px 10px rgba(0,0,0,0.2);
        }

        /* ── MÚSICA ── */
        .musica-container {
            background:rgba(247,239,236,0.15);
            border-radius:15px;
            padding:15px 25px;
            display:flex;
            align-items:center;
            gap:15px;
            flex-wrap:wrap;
            justify-content:center;
            backdrop-filter:blur(5px);
        }
        .musica-container label { color:white; font-size:14px; font-weight:bold; }
        .musica-container select {
            padding:8px 12px;
            border-radius:10px;
            border:none;
            background:#F7EFEC;
            color:#A2827A;
            font-size:14px;
            cursor:pointer;
        }

        /* volume */
        .volume-container {
            display:flex;
            align-items:center;
            gap:10px;
        }
        .volume-container label { color:white; font-size:13px; }
        input[type="range"] {
            -webkit-appearance:none;
            width:100px;
            height:4px;
            border-radius:5px;
            background:#F7EFEC;
            outline:none;
            cursor:pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance:none;
            width:16px; height:16px;
            border-radius:50%;
            background:#A2827A;
            cursor:pointer;
        }

        .duracao-container {
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            justify-content:center;
        }
        .dur-btn {
            padding:8px 20px;
            border:2px solid #F7EFEC;
            border-radius:50px;
            background:transparent;
            color:white;
            font-size:14px;
            cursor:pointer;
            transition:0.3s;
        }
        .dur-btn.ativo, .dur-btn:hover { background:#F7EFEC; color:#A2827A; }

        .botoes { display:flex; gap:15px; flex-wrap:wrap; justify-content:center; }
        .btn {
            padding:14px 40px;
            border:none;
            border-radius:50px;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }
        .btn-iniciar { background:#F7EFEC; color:#A2827A; }
        .btn-iniciar:hover { background:#ede0db; transform:translateY(-2px); }
        .btn-parar { background:transparent; border:2px solid #F7EFEC; color:white; }
        .btn-parar:hover { background:rgba(255,255,255,0.1); }

        .btn-voltar {
            padding:10px 25px;
            background:transparent;
            border:2px solid #F7EFEC;
            border-radius:50px;
            color:white;
            font-size:14px;
            cursor:pointer;
            text-decoration:none;
            display:inline-block;
            transition:0.3s;
        }
        .btn-voltar:hover { background:rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <img src="{% static 'core/imagens/logo.PNG' %}" alt="logo">
        <h1>MINDLY</h1>
    </div>
    <nav>
        <a href="{% url 'exercicios' %}">← Exercícios</a>
        <a href="{% url 'home' %}">Início</a>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
    {% csrf_token %}
    <button type="submit" class="logout-btn">Sair</button>
</form>
    </nav>
</header>

<main>
    <div class="onda"></div>
    <div class="onda"></div>
    <div class="onda"></div>
    <div class="onda"></div>

    <div class="conteudo">
        <h2>🧘 Mindfulness</h2>
        <p class="subtitulo">Fica presente no momento. Deixa os pensamentos passar como nuvens.</p>

        <div class="frase-container">
            <p class="frase" id="frase">"Fecha os olhos. Respira fundo. Estás aqui."</p>
        </div>

        <div class="temporizador" id="temporizador">05:00</div>

        <div class="duracao-container">
            <button class="dur-btn" onclick="escolherDuracao(2, this)">2 min</button>
            <button class="dur-btn ativo" onclick="escolherDuracao(5, this)">5 min</button>
            <button class="dur-btn" onclick="escolherDuracao(10, this)">10 min</button>
        </div>

        <div class="musica-container">
            <label>🎵 Som de fundo:</label>
            <select id="selectMusica">
                <option value="chuva">🌧️ Chuva</option>
                <option value="passaros">🐦 Pássaros</option>
                <option value="mar">🌊 Mar / Ondas</option>
                <option value="piano">🎹 Piano suave</option>
                <option value="silencio">🔇 Silêncio</option>
            </select>
            <div class="volume-container">
                <label>🔊</label>
                <input type="range" id="volume" min="0" max="1" step="0.1" value="0.5" oninput="ajustarVolume(this.value)">
            </div>
        </div>

        <div class="botoes">
            <button class="btn btn-iniciar" id="btnIniciar" onclick="iniciar()">▶ Iniciar</button>
            <button class="btn btn-parar" id="btnParar" onclick="parar()" style="display:none">⏸ Pausar</button>
        </div>

        <a href="{% url 'exercicios' %}" class="btn-voltar">← Voltar aos Exercícios</a>
    </div>
</main>

<!-- áudios pré-carregados -->
<audio id="audio-chuva"    src="{% static 'core/audio/chuva.mp3' %}"    loop preload="auto"></audio>
<audio id="audio-passaros" src="{% static 'core/audio/passaros.mp3' %}" loop preload="auto"></audio>
<audio id="audio-mar"      src="{% static 'core/audio/mar.mp3' %}"      loop preload="auto"></audio>
<audio id="audio-piano"    src="{% static 'core/audio/piano.mp3' %}"    loop preload="auto"></audio>

<script>
    let duracaoTotal = 5 * 60;
    let segundosRestantes = duracaoTotal;
    let intervalo = null;
    let intervaloFrase = null;
    let ativo = false;
    let audioAtual = null;

    const frases = [
        '"Fecha os olhos. Respira fundo. Estás aqui."',
        '"Observa os teus pensamentos sem os julgar."',
        '"Sente o peso do teu corpo. Estás seguro(a)."',
        '"Inspira paz. Expira tensão."',
        '"Cada momento é único. Aprecia este."',
        '"Deixa ir o que não controlas."',
        '"O teu corpo sabe como relaxar. Deixa-o."',
        '"Estás exatamente onde deves estar."',
        '"Sente o ar a entrar e a sair. Apenas isso."',
        '"A paz está dentro de ti."',
    ];
    let fraseAtual = 0;

    function escolherDuracao(minutos, btn) {
        duracaoTotal = minutos * 60;
        segundosRestantes = duracaoTotal;
        document.querySelectorAll('.dur-btn').forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativo');
        atualizarDisplay();
        if (ativo) parar();
    }

    function atualizarDisplay() {
        const m = Math.floor(segundosRestantes / 60).toString().padStart(2, '0');
        const s = (segundosRestantes % 60).toString().padStart(2, '0');
        document.getElementById('temporizador').textContent = `${m}:${s}`;
    }

    function trocarFrase() {
        const el = document.getElementById('frase');
        el.style.opacity = 0;
        setTimeout(() => {
            fraseAtual = (fraseAtual + 1) % frases.length;
            el.textContent = frases[fraseAtual];
            el.style.opacity = 1;
        }, 1000);
    }

    function pararAudio() {
        if (audioAtual) {
            audioAtual.pause();
            audioAtual.currentTime = 0;
            audioAtual = null;
        }
    }

    function tocarAudio() {
        pararAudio();
        const tipo = document.getElementById('selectMusica').value;
        if (tipo === 'silencio') return;
        const audio = document.getElementById('audio-' + tipo);
        if (audio) {
            audio.volume = parseFloat(document.getElementById('volume').value);
            audio.play();
            audioAtual = audio;
        }
    }

    function ajustarVolume(val) {
        if (audioAtual) audioAtual.volume = parseFloat(val);
    }

    function iniciar() {
        ativo = true;
        document.getElementById('btnIniciar').style.display = 'none';
        document.getElementById('btnParar').style.display = 'inline-block';
        tocarAudio();
        intervaloFrase = setInterval(trocarFrase, 15000);
        intervalo = setInterval(() => {
            segundosRestantes--;
            atualizarDisplay();
            if (segundosRestantes <= 0) terminar();
        }, 1000);
    }

    function parar() {
        ativo = false;
        clearInterval(intervalo);
        clearInterval(intervaloFrase);
        pararAudio();
        document.getElementById('btnIniciar').style.display = 'inline-block';
        document.getElementById('btnParar').style.display = 'none';
        segundosRestantes = duracaoTotal;
        atualizarDisplay();
        document.getElementById('frase').textContent = frases[0];
        document.getElementById('frase').style.opacity = 1;
    }

    function terminar() {
        ativo = false;
        clearInterval(intervalo);
        clearInterval(intervaloFrase);
        pararAudio();
        document.getElementById('btnIniciar').style.display = 'inline-block';
        document.getElementById('btnParar').style.display = 'none';
        document.getElementById('frase').textContent = '"Muito bem! Sessão concluída. 🌟"';
        document.getElementById('frase').style.opacity = 1;
        document.getElementById('temporizador').textContent = '00:00';
    }
</script>

</body>
</html>
